name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    # Base branches of the stacked installer and device-validation PRs.
    branches: [ "master", "fix/p0-installer-correctness", "fix/retry-entry-guard", "fix/card-action-ownership", "feat/loader-install-plans" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Check only: this step must never rewrite sources (run ./gradlew formatKotlin locally).
    - name: Kotlin style check
      run: ./gradlew lintKotlin

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build with Gradle
      run: ./gradlew assembleMiniDebug

    # ViewModel wiring probes (methods extracted verbatim, JVM only, no Android SDK).
    # Needs python3 and JDK 17 (javac + Kotlin compiler jar fetched from Maven Central).
    - name: Wiring probes
      run: python3 tools/wiring-probes/run_wiring_probes.py . --deps "$RUNNER_TEMP/wiring-probe-deps"

    - name: Fail if the build modified tracked files
      run: git diff --exit-code

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: app/build/outputs/apk/miniDebug
