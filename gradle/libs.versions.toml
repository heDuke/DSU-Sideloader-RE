compose-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose-runtime" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-runtime" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
